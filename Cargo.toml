[package]
name = "claude-acc"
version = "0.22.0"
edition = "2024"
# `File::lock`, which `config::locked` uses to keep two writers from dropping
# each other's edit, is stable since 1.89.0 — verified in the stdlib source:
# `#[stable(feature = "file_lock", since = "1.89.0")]`. Declared so an older
# toolchain fails with "requires rustc 1.89" instead of an unresolved method.
rust-version = "1.89"
description = "Claude Code Account Switcher — bind different accounts to different directories"
authors = ["Petr Radilov"]
license = "MIT"
repository = "https://github.com/Nemo-Illusionist/claude-code-account-switcher"

[dependencies]
aes = "0.9"
cbc = "0.2"
clap = { version = "4", features = ["derive"] }
dirs = "7"
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = "0.11"
unicode-normalization = "0.1.25"

[profile.release]
lto = true
strip = true
