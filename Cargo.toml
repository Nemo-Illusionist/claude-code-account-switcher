[package]
name = "claude-acc"
version = "0.15.0"
edition = "2024"
description = "Claude Code Account Switcher — bind different accounts to different directories"
authors = ["Petr Radilov"]
license = "MIT"
repository = "https://github.com/Nemo-Illusionist/claude-code-account-switcher"

[dependencies]
aes = "0.8"
cbc = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false }
serde_json = "1"
sha1 = { version = "0.10", default-features = false }
sha2 = "0.10"

[profile.release]
lto = true
strip = true
