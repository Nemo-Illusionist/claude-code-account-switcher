[package]
name = "claude-acc"
version = "0.17.0"
edition = "2024"
description = "Claude Code Account Switcher — bind different accounts to different directories"
authors = ["Petr Radilov"]
license = "MIT"
repository = "https://github.com/Nemo-Illusionist/claude-code-account-switcher"

[dependencies]
aes = "0.9"
cbc = "0.2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false }
serde_json = "1"
sha1 = { version = "0.11", default-features = false }
sha2 = "0.11"

[profile.release]
lto = true
strip = true
