name: release-please

on:
  push:
    branches:
      - master

# Declared per job rather than here: only release-please opens pull requests,
# and a token that can do it has no business being handed to a job that
# compiles code and uploads what it produced.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name:        ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: claude-acc-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: claude-acc-macos-aarch64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: claude-acc-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: claude-acc-linux-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: claude-acc-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # Spelled out because the pin replaced the `@stable` ref that used
          # to carry this.
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/claude-acc ${{ matrix.name }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/claude-acc.exe ${{ matrix.name }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ matrix.name }}"

  # Publish SHA256SUMS alongside the binaries.
  #
  # This tool handles other people's OAuth tokens, so "download a binary from
  # GitHub and hope" is not good enough: without a published digest there is
  # nothing to check a download against. Runs after the whole matrix, so every
  # asset is already on the release.
  checksums:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # No checkout: --repo names the repository, so this job never needs a
      # copy of the source to publish a digest of the binaries.
      - name: Download the published binaries
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir dist --pattern 'claude-acc-*'

      - name: Checksum them
        # Sorted so the file is byte-identical whatever order the downloads
        # arrived in, and names only — a digest listing the runner's paths
        # would not match what anyone verifies locally.
        run: |
          cd dist
          sha256sum claude-acc-* | sort -k2 > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Upload it
        # --clobber so re-running the job replaces the file instead of
        # failing on one that is already there.
        run: gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
