name: Shell

on:
  # No `paths` filter here on purpose. A required status check that never
  # runs never reports, and the pull request waits on it forever — so every
  # PR runs this, including one that only touches docs. The `push` filter
  # below keeps that from costing anything on master.
  pull_request:
  push:
    branches: [master]
    paths:
      - 'claude-switch.sh'
      - 'shell/**'
      - '.github/workflows/shell.yml'

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shell:
    name: zsh -n / bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax-check claude-switch.sh
        run: zsh -n claude-switch.sh

      - name: Syntax-check generated shell templates
        run: |
          zsh -n shell/init.zsh
          bash -n shell/init.bash
          bash -n shell/claude-wrapper.sh
          bash -n shell/claude-vscode-wrapper.sh

      # Both wrappers declare `#!/bin/sh`, so they have to hold up under a
      # POSIX shell too — `bash -n` alone would wave through a bashism that
      # breaks on a system where /bin/sh is dash.
      - name: Syntax-check the wrappers as POSIX sh
        run: |
          sh -n shell/claude-wrapper.sh
          sh -n shell/claude-vscode-wrapper.sh

      # Syntax is not where the bugs were. #118 was a grep pattern that
      # parsed fine and matched nothing on any real profile, so `desktop
      # list` called every signed-in profile signed out and `desktop run`
      # refused to launch one. These run the functions and check answers.
      #
      # The job name stays "zsh -n / bash -n" because the branch ruleset
      # requires that exact check; renaming it would silently stop gating.
      - name: Behaviour tests
        run: |
          for t in tests/shell/*.zsh; do
            echo "--- $t"
            zsh "$t"
          done

      # init.ps1 is `eval`'d by PowerShell users' profiles, so a syntax error
      # there breaks their shell startup. pwsh is preinstalled on the runner.
      - name: Syntax-check the PowerShell template
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path shell/init.ps1).Path, [ref]$null, [ref]$errors)
          if ($errors) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
          }
          Write-Output "shell/init.ps1 parses cleanly"
