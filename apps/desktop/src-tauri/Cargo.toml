[package]
name = "claude-acc-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
claude-acc = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
rfd = "0.15"

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
